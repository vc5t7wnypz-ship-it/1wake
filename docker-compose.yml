version: "3.9"

services:
  neo4j:
    image: neo4j:5.19-community
    container_name: wake_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/wakeanamnesis
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: "2G"
      NEO4J_dbms_memory_heap_max__size: "4G"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "wakeanamnesis", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: wake_jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: wakeanamnesis
    volumes:
      - .:/home/jovyan/work
      - model_cache:/home/jovyan/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wake_api
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: wakeanamnesis
      MODEL_CACHE_DIR: /app/model_cache
    volumes:
      - model_cache:/app/model_cache
    depends_on:
      neo4j:
        condition: service_healthy
    command: uvicorn wake.api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  model_cache:
