[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "wake-interpretability"
version = "0.1.0"
description = "Mechanistic interpretability of Finnegans Wake: superposed meaning in LLM residual streams"
authors = ["WAKE Project"]
readme = "README.md"
packages = [{include = "wake"}]

[tool.poetry.dependencies]
python = "^3.11"
torch = "^2.2"
transformers = "^4.40"
accelerate = "^0.29"
einops = "^0.7"
neo4j = "^5.19"
networkx = "^3.3"
numpy = "^1.26"
scipy = "^1.13"
scikit-learn = "^1.4"
pandas = "^2.2"
pyarrow = "^16.0"
fastapi = "^0.111"
uvicorn = {extras = ["standard"], version = "^0.29"}
pydantic = "^2.7"
httpx = "^0.27"
tqdm = "^4.66"
rich = "^13.7"
typer = "^0.12"
python-dotenv = "^1.0"
loguru = "^0.7"
orjson = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^5.0"
hypothesis = "^6.100"
ruff = "^0.4"
mypy = "^1.10"
pre-commit = "^3.7"
ipykernel = "^6.29"
jupyterlab = "^4.2"
matplotlib = "^3.9"
seaborn = "^0.13"
plotly = "^5.22"
ipywidgets = "^8.1"
nbformat = "^5.10"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=wake --cov-report=term-missing"
